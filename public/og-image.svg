<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#1a1a2e"/>
  
  <!-- Subtle gradient overlay -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="shieldGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#c23152;stop-opacity:1"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Decorative border -->
  <rect x="20" y="20" width="1160" height="590" rx="12" ry="12" fill="none" stroke="#e94560" stroke-width="2" opacity="0.3"/>
  
  <!-- Shield icon -->
  <g transform="translate(600, 200)">
    <!-- Shield shape -->
    <path d="M0,-80 L50,-60 L50,10 C50,50 25,75 0,90 C-25,75 -50,50 -50,10 L-50,-60 Z" 
          fill="url(#shieldGradient)" opacity="0.9"/>
    <!-- Lock/checkmark inside shield -->
    <path d="M0,-30 L15,-15 L-5,20 L-15,10 Z" fill="white" opacity="0.9"/>
    <!-- Small key hole circle -->
    <circle cx="0" cy="-10" r="8" fill="white" opacity="0.8"/>
    <rect x="-3" y="-5" width="6" height="15" rx="3" fill="white" opacity="0.8"/>
  </g>
  
  <!-- Main title: Aeterna -->
  <text x="600" y="340" font-family="Georgia, 'Times New Roman', serif" font-size="72" font-weight="bold" fill="white" text-anchor="middle" letter-spacing="4">
    Aeterna
  </text>
  
  <!-- Subtitle -->
  <text x="600" y="400" font-family="Arial, Helvetica, sans-serif" font-size="28" fill="#e94560" text-anchor="middle" letter-spacing="2">
    Digital Estate Planner
  </text>
  
  <!-- Divider line -->
  <line x1="450" y1="430" x2="750" y2="430" stroke="#e94560" stroke-width="1" opacity="0.5"/>
  
  <!-- Tagline -->
  <text x="600" y="470" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#cccccc" text-anchor="middle" font-style="italic">
    Your digital life shouldn't die with you
  </text>
  
  <!-- Bottom accent dots -->
  <circle cx="570" cy="540" r="4" fill="#e94560" opacity="0.6"/>
  <circle cx="590" cy="540" r="4" fill="#e94560" opacity="0.8"/>
  <circle cx="610" cy="540" r="4" fill="#e94560" opacity="1.0"/>
  <circle cx="630" cy="540" r="4" fill="#e94560" opacity="0.8"/>
  <circle cx="650" cy="540" r="4" fill="#e94560" opacity="0.6"/>
</svg>
